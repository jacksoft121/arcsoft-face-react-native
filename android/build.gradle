plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    // ✅ 统一 namespace（避免你 zip 里 package 混乱）
    namespace "com.rnarcface"

    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34

        // 你是单人脸第一阶段
        consumerProguardFiles "consumer-rules.pro"
    }

    sourceSets {
        main {
            // ✅ 你应把 so 放到 src/main/jniLibs/<abi>/ 下
            jniLibs.srcDirs = ['src/main/jniLibs']
            // ✅ jar 放到 src/main/libs/
            // （如果你放在 android/libs 也行，但推荐 src/main/libs 更规范）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // RN 0.78 组件
    implementation("com.facebook.react:react-android")

    // VisionCamera 的 FrameProcessorPlugin 类来自 vision-camera
    // 通常 app 工程已经依赖了 vision-camera，这里用 compileOnly 避免重复打包
    compileOnly("com.mrousavy.camera:react-native-vision-camera")

    // kotlin stdlib（一般由插件自动带，但显式写更稳）
    implementation("org.jetbrains.kotlin:kotlin-stdlib")
}
